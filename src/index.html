<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Anti-FOUC thème : applique la classe `dark` AVANT le premier rendu.
      La logique est identique à ThemeService (clé `theme` : 'dark' | 'light',
      sinon prefers-color-scheme) pour éviter tout désaccord et tout flash inverse.
      Sans JS (ou si localStorage est bloqué), le rendu reste en light.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldBeDark = saved ? saved === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', shouldBeDark);
        } catch (e) {
          /* localStorage indisponible : on garde le rendu par défaut (light) */
        }
      })();
    </script>

    <!-- Fond de page avant le chargement des feuilles de style (anti-flash blanc) -->
    <style>
      html {
        background-color: #ffffff;
      }
      html.dark {

      }
    </style>
