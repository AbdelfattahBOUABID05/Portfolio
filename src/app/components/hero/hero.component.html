<section id="hero" appScrollReveal class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 pt-20 overflow-hidden relative transition-colors duration-500">
  <!-- Dynamic background effects -->
  <div class="absolute -top-32 -left-32 w-[600px] h-[600px] bg-blue-600/5 dark:bg-blue-600/10 rounded-full blur-[80px] pointer-events-none will-change-transform transform-gpu" aria-hidden="true"></div>
  <div class="absolute -bottom-32 -right-32 w-[600px] h-[600px] bg-emerald-600/5 dark:bg-emerald-600/10 rounded-full blur-[80px] pointer-events-none will-change-transform transform-gpu" aria-hidden="true"></div>

  <div class="container mx-auto px-6 relative z-10">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
      
      <!-- Left Column: Text Content -->
      <div class="space-y-8 text-center lg:text-left">
        
        <!-- Greeting Badge -->
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-blue-600 dark:text-blue-400 text-xs font-black uppercase tracking-[0.2em] backdrop-blur-sm">
          <span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
          {{ 'hero.available' | translate }}
        </div>

        <!-- Main Heading -->
        <div class="space-y-4">
          <h1 class="text-5xl md:text-7xl lg:text-8xl font-black text-slate-900 dark:text-white tracking-tighter leading-[0.9]">
            Abdelfattah BOUABID<br>
            <span class="text-slate-600 dark:text-slate-400 italic transition-colors">{{ 'hero.title' | translate }}.</span>
          </h1>
          <p class="text-lg md:text-xl font-bold text-blue-600 dark:text-blue-500 tracking-tight uppercase">
            {{ 'hero.tagline' | translate }}
          </p>
        </div>

        <!-- Description -->
        <p class="text-slate-600 dark:text-slate-400 text-lg md:text-xl max-w-2xl mx-auto lg:mx-0 leading-relaxed">
          {{ 'hero.description' | translate }}
        </p>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-6 pt-8">
          <app-button variant="primary" size="lg" href="#projects" [fullWidth]="true">
            {{ 'hero.viewProjects' | translate }}
            <span class="flex items-center justify-center group-hover:translate-x-1 rtl:group-hover:-translate-x-1 transition-transform">
              <svg lucideArrowRight [size]="18"></svg>
            </span>
          </app-button>

          <app-button variant="secondary" size="lg" [fullWidth]="true" (click)="languageService.downloadCV()">
            <span class="flex items-center justify-center">
              <svg lucideDownload [size]="18"></svg>
            </span>
            {{ 'hero.downloadCV' | translate }}
          </app-button>
        </div>
      </div>

      <!-- Right Column: Photo - Ultra Minimalist -->
      <div class="flex justify-center lg:justify-end">
        <div class="w-full max-w-md">
          <picture>
            <source
              type="image/avif"
              srcset="assets/me-320.avif 320w, assets/me-480.avif 480w, assets/me-624.avif 624w"
              sizes="(min-width: 1024px) 448px, 100vw">
            <source
              type="image/webp"
              srcset="assets/me-320.webp 320w, assets/me-480.webp 480w, assets/me-624.webp 624w"
              sizes="(min-width: 1024px) 448px, 100vw">
          <img 
            src="assets/me.png" 
            alt="Abdelfattah BOUABID" 
            class="w-full h-auto object-contain"
            width="624"
            height="832"
            fetchpriority="high"
            decoding="async"
          >
          </picture>
        </div>
      </div>

    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-60 dark:opacity-60">
    <div class="w-px h-12 bg-gradient-to-b from-blue-500 to-transparent"></div>
    <span class="text-xs font-black uppercase tracking-widest text-slate-900 dark:text-white">{{ 'hero.scroll' | translate }}</span>
  </div>
</section>
