<section id="impact" appScrollReveal class="py-32 bg-white dark:bg-slate-950 transition-colors duration-500">
  <div class="container mx-auto px-6">
    <div class="max-w-4xl mb-20">
      <h2 class="text-sm font-black tracking-[0.3em] uppercase text-blue-700 dark:text-blue-400 mb-3">
        {{ 'impact.subtitle' | translate }}
      </h2>
      <h3 class="text-4xl md:text-5xl lg:text-6xl font-black text-slate-900 dark:text-white leading-tight tracking-tight">
        {{ 'impact.title' | translate }}
      </h3>
    </div>

    <!-- 5 métriques dérivées des données. Sur mobile (grid-cols-2) la 5e carte
         occupe les deux colonnes et reste centrée ; dès md, une seule rangée de 5.
         Espacement via `gap-*` (jamais `space-y-*`). -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-6">
      @for (stat of stats(); track stat.labelKey) {
        <app-card padding="md" class="h-full" [ngClass]="$last ? 'col-span-2 md:col-span-1' : ''">
          <div class="h-full flex flex-col items-center justify-center text-center gap-4">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-blue-500/10 text-blue-600 dark:text-blue-500">
              <ng-container *ngComponentOutlet="stat.icon; inputs: { size: 24 }"></ng-container>
            </div>
            <span class="text-3xl md:text-4xl font-black text-slate-900 dark:text-white">{{ stat.value }}</span>
            <p class="text-xs font-black uppercase tracking-widest text-slate-600 dark:text-slate-400">
              {{ stat.labelKey | translate }}
            </p>
          </div>
        </app-card>
      }
    </div>
  </div>
</section>
