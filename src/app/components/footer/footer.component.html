<footer class="bg-white dark:bg-slate-950 pt-24 pb-12 border-t border-slate-100 dark:border-slate-900 transition-colors duration-500">
  <div class="container mx-auto px-6">
    <div class="flex flex-col md:flex-row justify-between items-center gap-12">
      
      <!-- Brand -->
      <div class="flex flex-col gap-4 text-center md:text-left">
        <h4 class="text-xl font-black tracking-tighter text-slate-900 dark:text-white">
          ABDELFATTAH <span class="text-blue-500">BOUABID</span>
        </h4>
        <p class="text-slate-600 dark:text-slate-400 text-sm max-w-xs leading-relaxed font-medium">
          {{ 'footer.tagline' | translate }}
        </p>
      </div>

      <!-- Quick Links -->
      <div class="flex flex-wrap justify-center gap-8">
        <a href="#about" class="text-xs font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white transition-colors">{{ 'footer.about' | translate }}</a>
        <a href="#services" class="text-xs font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white transition-colors">{{ 'footer.services' | translate }}</a>
        <a href="#projects" class="text-xs font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white transition-colors">{{ 'footer.projects' | translate }}</a>
        <a href="#contact" class="text-xs font-black uppercase tracking-widest text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white transition-colors">{{ 'footer.contact' | translate }}</a>
      </div>

      <!-- Socials -->
      <div class="flex items-center gap-4">
        <app-button variant="ghost" size="icon" href="https://github.com/AbdelfattahBOUABID05" target="_blank" rel="noopener noreferrer" [ariaLabel]="'social.github' | translate">
          <svg lucideCodeXml [size]="20" aria-hidden="true"></svg>
        </app-button>
        <app-button variant="ghost" size="icon" href="https://www.linkedin.com/in/abdelfattah-bouabid-150a56335" target="_blank" rel="noopener noreferrer" [ariaLabel]="'social.linkedin' | translate">
          <svg lucideBriefcase [size]="20" aria-hidden="true"></svg>
        </app-button>
        <app-button variant="ghost" size="icon" href="mailto:abdelfattahbouabid123@gmail.com" [ariaLabel]="'social.email' | translate">
          <svg lucideMail [size]="20" aria-hidden="true"></svg>
        </app-button>
      </div>

    </div>

    <!-- Copyright -->
    <div class="mt-24 pt-12 border-t border-slate-100 dark:border-slate-900 text-center">
      <p class="text-slate-600 dark:text-slate-400 text-xs font-black uppercase tracking-[0.3em]">
        &copy; {{ currentYear }} Abdelfattah Bouabid • {{ 'footer.copyright' | translate }}
      </p>
    </div>
  </div>
</footer>
